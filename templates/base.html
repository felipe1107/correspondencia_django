<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Correspondencia</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{% url 'dashboard' %}">Correspondencia</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'entrada_list' %}">Entradas</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'salida_list' %}">Salidas</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'gestor_list' %}">Gestores</a></li>
            </ul>
            {% if user.is_authenticated %}
            <span class="navbar-text me-3">Hola, {{ user.username }}</span>
            <a class="btn btn-outline-light" href="{% url 'logout' %}">Cerrar sesión</a>
            {% endif %}
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
