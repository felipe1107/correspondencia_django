<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Sistema de Correspondencia{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'correspondencia_app:dashboard' %}">
        <img src="{% static 'img/logo.png' %}" alt="Logo" height="30">
        Correspondencia
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          {% if user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'correspondencia_app:dashboard' %}">Dashboard</a>
            </li>
            {% if user.is_staff %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'correspondencia_app:entrada_list' %}">Entradas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'correspondencia_app:gestor_list' %}">Gestores</a>
            </li>
            {% endif %}
          {% endif %}
        </ul>
        <ul class="navbar-nav">
          {% if user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'correspondencia_app:logout' %}">Salir</a>
            </li>
          {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'correspondencia_app:login' %}">Ingresar</a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
