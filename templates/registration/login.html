{% extends 'correspondencia_app/base.html' %}

{% block content %}
<div class="form-container">
    <h2>Iniciar Sesión</h2>
    {% if form.errors %}
        <p class="error">Usuario o contraseña incorrectos. Intenta de nuevo.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="id_username">Usuario:</label>
        {{ form.username }}

        <label for="id_password">Contraseña:</label>
        {{ form.password }}

        <button type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
