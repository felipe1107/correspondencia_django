{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static 'correspondencia_app/css/estilos.css' %}">
</head>
<body>
    <div class="container">
        <h2>Iniciar Sesión</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Ingresar</button>
        </form>
        {% if form.errors %}
            <p style="color: red;">Usuario o contraseña incorrectos.</p>
        {% endif %}
    </div>
</body>
</html>
