{% extends 'correspondencia_app/base.html' %}
{% block title %}{% if form.instance.pk %}Editar{% else %}Nuevo{% endif %} Gestor{% endblock %}
{% block content %}
  <h2>{% if form.instance.pk %}Editar{% else %}Nuevo{% endif %} Gestor</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'document_manager_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
{% endblock %}
