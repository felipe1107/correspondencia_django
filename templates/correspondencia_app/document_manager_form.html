{% extends "correspondencia_app/base.html" %}
{% load static %}

{% block content %}
  <div class="container">
    <h2>
      {% if edit %}Editar Gestor{% else %}Nuevo Gestor{% endif %}
    </h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-success" type="submit">
        {% if edit %}Guardar cambios{% else %}Crear gestor{% endif %}
      </button>
      <a class="btn btn-secondary" href="{% url 'correspondencia_app:document_manager_list' %}">
        Cancelar
      </a>
    </form>
  </div>
{% endblock %}
