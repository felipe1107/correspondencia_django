{% extends 'base.html' %}
{% block content %}
<h2>Editar Entrada de Correspondencia</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>

    <button type="submit" class="btn">💾 Actualizar</button>
    <a href="{% url 'entrada_list' %}" class="btn">🔙 Volver</a>
</form>
{% endblock %}
