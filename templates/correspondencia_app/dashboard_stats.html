{% extends "correspondencia_app/base.html" %}
{% block title %}Dashboard Estadísticas{% endblock %}
{% block content %}
  <div class="container py-4">
    <h2>Dashboard de Estadísticas</h2>
    <div class="row mt-4">
      <!-- Entradas por Gestor -->
      <div class="col-md-6">
        <div class="card shadow-sm mb-4">
          <div class="card-header">Entradas por Gestor</div>
          <div class="card-body">
            <canvas id="chartGestor"></canvas>
          </div>
        </div>
      </div>
      <!-- Entradas por Estado -->
      <div class="col-md-6">
        <div class="card shadow-sm mb-4">
          <div class="card-header">Entradas por Estado</div>
          <div class="card-body">
            <canvas id="chartEstado"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const dataGestor = {{ by_gestor|safe }};
    const dataEstado = {{ by_estado|safe }};

    const labelsG = dataGestor.map(o => o['gestor__nombre'] || 'Sin gestor');
    const valuesG = dataGestor.map(o => o.total);

    const labelsE = dataEstado.map(o => o.estado);
    const valuesE = dataEstado.map(o => o.total);

    new Chart(document.getElementById('chartGestor'), {
      type: 'bar',
      data: {
        labels: labelsG,
        datasets: [{ label: 'Total Entradas', data: valuesG, borderWidth: 1 }]
      },
      options: { scales: { y: { beginAtZero: true } } }
    });

    new Chart(document.getElementById('chartEstado'), {
      type: 'pie',
      data: {
        labels: labelsE,
        datasets: [{ label: 'Entradas', data: valuesE, borderWidth: 1 }]
      }
    });
  </script>
{% endblock %}
