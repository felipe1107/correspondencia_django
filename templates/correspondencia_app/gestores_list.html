{% extends 'base.html' %}

{% block content %}
<h2>Gestores</h2>
<table>
    <tr>
        <th>Nombre</th>
        <th>Departamento</th>
    </tr>
    {% for gestor in gestores %}
    <tr>
        <td>{{ gestor.nombre }}</td>
        <td>{{ gestor.departamento.nombre }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
