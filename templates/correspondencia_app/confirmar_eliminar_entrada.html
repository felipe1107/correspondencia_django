{% extends "base.html" %}

{% block content %}
<h1>¿Confirmar eliminación?</h1>
<p>¿Está seguro que desea eliminar la entrada: <strong>{{ entrada.asunto }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'lista_entradas' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
