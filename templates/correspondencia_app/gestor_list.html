{% extends 'base.html' %}

{% block content %}
  <h2>Gestores Registrados</h2>
  <a href="{% url 'correspondencia_app:gestor_create' %}">Nuevo Gestor</a>
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}
        <tr>
          <td>{{ item.nombre }}</td>
          <td>{{ item.correo }}</td>
          <td>{{ item.telefono }}</td>
          <td>
            <a href="{% url 'correspondencia_app:gestor_update' item.id %}">Editar</a> |
            <form action="{% url 'correspondencia_app:gestor_delete' item.id %}" method="post" style="display:inline;">
              {% csrf_token %}
              <button type="submit" onclick="return confirm('¿Estás seguro de eliminar este gestor?')">Eliminar</button>
            </form>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="4">No hay gestores registrados.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
