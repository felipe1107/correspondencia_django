{% extends 'correspondencia_app/base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Lista de Gestores</h2>
  <a href="{% url 'crear_gestor' %}" class="btn btn-success mb-3">+ Nuevo Gestor</a>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Rol</th>
      </tr>
    </thead>
    <tbody>
      {% for gestor in gestores %}
      <tr>
        <td>{{ gestor.nombre }}</td>
        <td>{{ gestor.correo }}</td>
        <td>{{ gestor.rol }}</td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">No hay gestores registrados.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
