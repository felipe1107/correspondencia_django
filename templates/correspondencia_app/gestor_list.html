{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Gestores Registrados</h2>
    <a href="{% url 'crear_gestor' %}" class="btn btn-success mb-3">Nuevo Gestor</a>
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Departamento</th>
                <th>Correo Electrónico</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.nombre }}</td>
                <td>{{ item.departamento }}</td>
                <td>{{ item.correo }}</td>
                <td>{{ item.telefono }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
