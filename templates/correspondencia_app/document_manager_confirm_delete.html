{% extends "correspondencia_app/base.html" %}
{% block content %}
  <div class="container mt-4">
    <h2 class="mb-3">¿Eliminar gestor “{{ gestor.nombre }}”?</h2>
    <p>Esta acción eliminará permanentemente al gestor y sus registros relacionados.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sí, eliminar</button>
      <a href="{% url 'correspondencia_app:document_manager_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
{% endblock %}
