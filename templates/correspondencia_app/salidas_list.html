{% extends 'base.html' %}

{% block content %}
<h2>Correspondencia de Salida</h2>
<table>
    <tr>
        <th>N° Documento</th>
        <th>Fecha</th>
        <th>Destinatario</th>
        <th>Asunto</th>
    </tr>
    {% for salida in salidas %}
    <tr>
        <td>{{ salida.numero_documento }}</td>
        <td>{{ salida.fecha_envio }}</td>
        <td>{{ salida.destinatario }}</td>
        <td>{{ salida.asunto }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
