{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center">Panel de Control</h1>
    <div class="row mt-5">

        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5>Correspondencia Recibida</h5>
                    <a href="{% url 'correspondencia_app:entradas_list' %}" class="btn btn-primary mt-2">Ver Entradas</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5>Correspondencia Enviada</h5>
                    <a href="{% url 'correspondencia_app:salidas_list' %}" class="btn btn-success mt-2">Ver Salidas</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5>Gestores</h5>
                    <a href="{% url 'correspondencia_app:gestores_list' %}" class="btn btn-info mt-2">Ver Gestores</a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
