{% extends 'correspondencia_app/base.html' %}

{% block content %}
<h2 class="mb-4">Panel de Control</h2>
<div class="row">
    <div class="col-md-6">
        <h5>Entradas por Mes</h5>
        <canvas id="chartEntradas"></canvas>
    </div>
    <div class="col-md-6">
        <h5>Salidas por Mes</h5>
        <canvas id="chartSalidas"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Cargar datos de Entradas
    fetch("{% url 'entradas_por_mes' %}")
    .then(response => response.json())
    .then(data => {
        const ctx = document.getElementById('chartEntradas').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.labels,
                datasets: [{
                    label: 'Correspondencia Entrante',
                    data: data.data,
                    borderWidth: 1
                }]
            }
        });
    });

    // Cargar datos de Salidas
    fetch("{% url 'salidas_por_mes' %}")
    .then(response => response.json())
    .then(data => {
        const ctx = document.getElementById('chartSalidas').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.labels,
                datasets: [{
                    label: 'Correspondencia Saliente',
                    data: data.data,
                    borderWidth: 1
                }]
            }
        });
    });
</script>
{% endblock %}
