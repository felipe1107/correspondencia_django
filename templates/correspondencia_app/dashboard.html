{% extends 'correspondencia_app/base.html' %}
{% block title %}Dashboard - Sistema de Correspondencia{% endblock %}

{% block content %}
<h1 class="mb-4">Panel Principal</h1>

<div class="row">
  <div class="col-md-6">
    <canvas id="graficoEntradas" width="100%" height="60"></canvas>
  </div>
  <div class="col-md-6">
    <canvas id="graficoSalidas" width="100%" height="60"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    fetch("{% url 'correspondencia_app:entradas_por_mes' %}")
      .then(response => response.json())
      .then(data => {
        new Chart(document.getElementById("graficoEntradas"), {
          type: "bar",
          data: {
            labels: data.labels,
            datasets: [{
              label: "Entradas por Mes",
              data: data.data,
              backgroundColor: "rgba(54, 162, 235, 0.6)",
              borderColor: "rgba(54, 162, 235, 1)",
              borderWidth: 1,
            }]
          },
        });
      });

    fetch("{% url 'correspondencia_app:salidas_por_mes' %}")
      .then(response => response.json())
      .then(data => {
        new Chart(document.getElementById("graficoSalidas"), {
          type: "bar",
          data: {
            labels: data.labels,
            datasets: [{
              label: "Salidas por Mes",
              data: data.data,
              backgroundColor: "rgba(255, 99, 132, 0.6)",
              borderColor: "rgba(255, 99, 132, 1)",
              borderWidth: 1,
            }]
          },
        });
      });
  });
</script>
{% endblock %}
