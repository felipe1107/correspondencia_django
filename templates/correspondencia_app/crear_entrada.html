{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Nueva Correspondencia de Entrada</h2>

    <form method="post" enctype="multipart/form-data" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'lista_entradas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
