{% extends 'correspondencia_app/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>¿Deseas eliminar al usuario "{{ usuario.username }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'usuario_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
