{% extends "base.html" %}

{% block content %}
<h1>{% if form.instance.pk %}Editar{% else %}Registrar nueva{% endif %} entrada</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'lista_entradas' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
