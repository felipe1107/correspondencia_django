{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-danger">¿Estás seguro que deseas eliminar esta entrada?</h2>

    <div class="alert alert-warning mt-4">
        <p><strong>N° Documento:</strong> {{ entrada.numero_documento }}</p>
        <p><strong>Remitente:</strong> {{ entrada.remitente }}</p>
        <p><strong>Asunto:</strong> {{ entrada.asunto }}</p>
        <p><strong>Fecha de Recepción:</strong> {{ entrada.fecha_recepcion }}</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'lista_entradas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
