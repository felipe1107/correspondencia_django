{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Registrar Nuevo Gestor</h2>

<form method="POST" class="card p-4 shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="mt-3">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{% url 'gestor_list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
