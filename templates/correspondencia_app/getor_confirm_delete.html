{% extends "correspondencia_app/base.html" %}

{% block content %}
  <h2>Confirmar Eliminación de Gestor</h2>
  <p>¿Estás seguro que deseas eliminar al gestor <strong>{{ item.nombre }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'correspondencia_app:gestor_list' %}">Cancelar</a>
  </form>
{% endblock %}
