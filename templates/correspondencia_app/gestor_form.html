{% extends 'base.html' %}

{% block title %}Formulario de Gestor{% endblock %}

{% block content %}
<div class="container">
  <h2>{{ form.instance.pk|yesno:"Editar Gestor,Nuevo Gestor" }}</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'correspondencia_app:gestor_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
