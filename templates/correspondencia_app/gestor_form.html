{% extends 'correspondencia_app/base.html' %}

{% block content %}
<h2>{% if form.instance.pk %}✏️ Editar Gestor{% else %}➕ Agregar Gestor{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="id_nombre">👤 Nombre:</label>
        {{ form.nombre }}
    </div>
    <div class="form-group">
        <label for="id_correo">📧 Correo:</label>
        {{ form.correo }}
    </div>
    <div class="form-group">
        <label for="id_telefono">☎️ Teléfono:</label>
        {{ form.telefono }}
    </div>
    <div class="form-group">
        <label for="id_departamento">🏢 Departamento:</label>
        {{ form.departamento }}
    </div>
    <button type="submit" class="btn btn-success">💾 Guardar</button>
    <a href="{% url 'gestor_list' %}" class="btn btn-secondary">↩️ Volver</a>
</form>
{% endblock %}
