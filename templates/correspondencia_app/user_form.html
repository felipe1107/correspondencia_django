{% extends 'correspondencia_app/base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<h2>{{ title }}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{% url 'correspondencia_app:user_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
