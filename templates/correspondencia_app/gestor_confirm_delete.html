{% extends 'base.html' %}
{% block content %}
  <h2>Confirmar eliminación</h2>
  <p>¿Estás seguro que deseas eliminar al gestor: "{{ item.nombre }}"?</p>
  <form method="post">
    {% csrf_token %}
    <a href="{% url 'correspondencia_app:gestor_list' %}" class="btn btn-secondary">Cancelar</a>
    <button type="submit" class="btn btn-danger">Eliminar</button>
  </form>
{% endblock %}
