{% extends 'base.html' %}

{% block title %}Eliminar Gestor{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>Confirmar eliminación</h2>
  <p>¿Estás seguro de que deseas eliminar al gestor: <strong>{{ object.nombre }}</strong>?</p>
  
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'correspondencia_app:gestor_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
