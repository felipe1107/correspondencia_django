{% extends 'correspondencia_app/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Confirmar eliminación</h2>
    <p>¿Estás seguro de que deseas eliminar la correspondencia de entrada con número <strong>{{ entrada.numero_documento }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'entrada_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
