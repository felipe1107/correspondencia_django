{% extends 'correspondencia_app/base.html' %}

{% block content %}
<h2>¿Estás seguro que deseas eliminar esta entrada?</h2>

<p><strong>Asunto:</strong> {{ item.asunto }}</p>
<p><strong>Remitente:</strong> {{ item.remitente }}</p>
<p><strong>Fecha de recepción:</strong> {{ item.fecha_recepcion }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">🗑️ Eliminar</button>
    <a href="{% url 'entrada_list' %}" class="btn">🔙 Cancelar</a>
</form>
{% endblock %}
