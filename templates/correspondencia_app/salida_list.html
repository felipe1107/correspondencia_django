{% extends "base.html" %}
{% block content %}
<h2>Salidas de Correspondencia</h2>
<table class="table table-bordered">
    <thead><tr><th>Número</th><th>Fecha</th><th>Destinatario</th><th>Asunto</th></tr></thead>
    <tbody>
        {% for salida in salidas %}
        <tr>
            <td>{{ salida.numero_documento }}</td>
            <td>{{ salida.fecha_recepcion }}</td>
            <td>{{ salida.destinatario }}</td>
            <td>{{ salida.asunto }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'crear_salida' %}" class="btn btn-success">Nueva Salida</a>
{% endblock %}
