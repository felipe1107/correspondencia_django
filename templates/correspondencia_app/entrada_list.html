{% extends "correspondencia_app/base.html" %}
{% load static %}

{% block content %}
<div class="inner-bg p-4">
  <h2>Lista de Entradas</h2>
  <a href="{% url 'correspondencia_app:entrada_create' %}" class="btn btn-success mb-3">
    Nueva Entrada
  </a>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Asunto</th>
        <th>Remitente</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for e in entradas %}
      <tr>
        <td>{{ e.id }}</td>
        <td>{{ e.asunto }}</td>
        <td>{{ e.remitente }}</td>
        <td>
          <!-- aquí podrías poner botones de editar/ver detalle, si luego los añades -->
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4">No hay entradas aún.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
