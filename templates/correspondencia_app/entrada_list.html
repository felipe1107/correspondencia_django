{% extends "base.html" %}
{% block content %}
<h2>Entradas de Correspondencia</h2>
<table class="table table-bordered">
    <thead><tr><th>Número</th><th>Fecha</th><th>Remitente</th><th>Asunto</th></tr></thead>
    <tbody>
        {% for entrada in entradas %}
        <tr>
            <td>{{ entrada.numero_documento }}</td>
            <td>{{ entrada.fecha_recepcion }}</td>
            <td>{{ entrada.remitente }}</td>
            <td>{{ entrada.asunto }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'crear_entrada' %}" class="btn btn-success">Nueva Entrada</a>
{% endblock %}
