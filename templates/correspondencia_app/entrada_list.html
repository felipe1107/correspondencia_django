{% extends "correspondencia_app/base.html" %}
{% block content %}
<table class="table">
  <thead>
    <tr>
      <th>#</th><th>Asunto</th><th>Fecha</th><th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for e in entradas %}
    <tr>
      <td>{{ e.pk }}</td>
      <td>{{ e.asunto }}</td>
      <td>{{ e.fecha_recepcion }}</td>
      <td>
        {% if request.user.is_staff %}
          <a class="btn btn-sm btn-primary" href="{% url 'correspondencia_app:entrada_edit' e.pk %}">Editar</a>
          <a class="btn btn-sm btn-danger"  href="{% url 'correspondencia_app:entrada_delete' e.pk %}">Eliminar</a>
        {% else %}
          —  <!-- Sin acciones para usuarios normales -->
        {% endif %}
      </td>
    </tr>
    {% empty %}
      <tr><td colspan="4">No hay entradas</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
