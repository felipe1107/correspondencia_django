{% extends 'correspondencia_app/base.html' %}
{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
<h2>¿Eliminar usuario {{ user.username }}?</h2>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, eliminar</button>
  <a href="{% url 'correspondencia_app:user_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
