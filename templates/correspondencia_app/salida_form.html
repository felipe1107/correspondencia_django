{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Registrar Nueva Salida</h2>

<form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'salida_list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
