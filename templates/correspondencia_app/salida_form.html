{% extends 'correspondencia_app/base.html' %}

{% block content %}
<h2>Nueva Correspondencia Saliente</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'salida_lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
