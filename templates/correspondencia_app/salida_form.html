{% extends 'base.html' %}

{% block content %}
<h2>📤 Registrar Nueva Salida</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">💾 Guardar</button>
    <a href="{% url 'correspondencia_app:salida_list' %}" class="btn btn-secondary">↩️ Cancelar</a>
</form>
{% endblock %}
