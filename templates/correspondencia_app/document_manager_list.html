{% extends 'correspondencia_app/base.html' %}
{% block title %}Lista de Gestores{% endblock %}
{% block content %}
  <h2>Gestores de Documentos</h2>
  <a href="{% url 'document_manager_create' %}" class="btn btn-success mb-3">Nuevo Gestor</a>
  <table class="table table-striped">
    <thead>
      <tr><th>Nombre</th><th>Email</th><th>Teléfono</th></tr>
    </thead>
    <tbody>
    {% for g in gestores %}
      <tr>
        <td>{{ g.nombre }}</td>
        <td>{{ g.email }}</td>
        <td>{{ g.telefono }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="3">No hay gestores.</td></tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
