<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de Correspondencia{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="{% url 'correspondencia_app:dashboard' %}">Correspondencia</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'correspondencia_app:entrada_list' %}">Entradas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'correspondencia_app:salida_list' %}">Salidas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'correspondencia_app:gestor_list' %}">Gestores</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        <!-- Contenido específico de cada vista -->
        {% endblock %}
    </div>

    <footer class="text-center mt-4 mb-2">
        <p class="text-muted">Sistema de Correspondencia - JP Tech Solutions</p>
    </footer>
</body>
</html>
