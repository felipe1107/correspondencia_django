<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Correspondencia</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
        header, nav, main, footer { margin-bottom: 20px; }
        header { background-color: #004080; color: white; padding: 10px; border-radius: 5px; }
        nav a { margin-right: 15px; text-decoration: none; color: #004080; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #eee; }
        a.boton { padding: 5px 10px; background-color: #004080; color: white; border-radius: 3px; text-decoration: none; }
        a.boton:hover { background-color: #003366; }
    </style>
</head>
<body>
    <header>
        <h1>Sistema de Correspondencia</h1>
    </header>

    <nav>
        <a href="{% url 'correspondencia_app:dashboard' %}">Inicio</a>
        <a href="{% url 'correspondencia_app:entrada_list' %}">Entradas</a>
        <a href="{% url 'correspondencia_app:salida_list' %}">Salidas</a>
        <a href="{% url 'correspondencia_app:gestor_list' %}">Gestores</a>
        <a href="{% url 'correspondencia_app:logout' %}">Cerrar sesión</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 Sistema de Correspondencia - JP Tech Solutions</p>
    </footer>
</body>
</html>
