<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de Correspondencia{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'correspondencia_app:dashboard' %}">Correspondencia</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'correspondencia_app:entrada_list' %}">Entradas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'correspondencia_app:salida_list' %}">Salidas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'correspondencia_app:gestor_list' %}">Gestores</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
