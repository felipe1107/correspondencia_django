<!-- correspondencia_app/templates/correspondencia_app/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de Correspondencia{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        header {
            background-color: #004488;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            margin-top: 10px;
            background-color: #e1e1e1;
            padding: 10px;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #004488;
            font-weight: bold;
        }

        main {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            color: #999;
            margin-top: 30px;
        }

        .logout {
            float: right;
        }
    </style>
</head>
<body>
    <header>
        <h1>Sistema de Correspondencia</h1>
        {% if user.is_authenticated %}
            <div class="logout">
                Bienvenido, {{ user.username }} |
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:white; font-weight:bold; cursor:pointer;">Cerrar sesión</button>
                </form>
            </div>
        {% endif %}
    </header>

    <nav>
        <a href="{% url 'entrada_list' %}">Entradas</a>
        <a href="{% url 'salida_list' %}">Salidas</a>
        <a href="{% url 'gestor_list' %}">Gestores</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 - Felipe Pinto - JP Tech Solutions</p>
    </footer>
</body>
</html>
