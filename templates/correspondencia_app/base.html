<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Correspondencia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 10px;
            text-align: center;
        }
        nav {
            background-color: #f0f0f0;
            padding: 10px;
            text-align: center;
        }
        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #007bff;
        }
        .container {
            padding: 20px;
        }
        footer {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .user-info {
            text-align: right;
            margin: 10px 20px 0 0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <h1>Sistema de Correspondencia</h1>
</header>

{% if user.is_authenticated %}
    <div class="user-info">
        Bienvenido, {{ user.username }} | <a href="{% url 'logout' %}">Cerrar sesión</a>
    </div>
{% endif %}

<nav>
    <a href="{% url 'correspondencia_app:entrada_list' %}">Entradas</a>
    <a href="{% url 'correspondencia_app:salida_list' %}">Salidas</a>
    <a href="{% url 'correspondencia_app:gestor_list' %}">Gestores</a>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<footer>
    <p>© 2025 Sistema de Correspondencia - JP Tech Solutions</p>
</footer>

</body>
</html>
