{% extends 'correspondencia_app/base.html' %}
{% block title %}Entrada de Correspondencia{% endblock %}

{% block content %}
<h2>{% if form.instance.pk %}Editar{% else %}Nueva{% endif %} Entrada</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'correspondencia_app:entrada_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
