{% extends 'base.html' %}

{% block content %}
<h2>Nueva Entrada de Correspondencia</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'correspondencia_app:entrada_list' %}">Cancelar</a>
</form>
{% endblock %}
