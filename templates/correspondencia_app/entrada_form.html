{% extends "correspondencia_app/base.html" %}
{% block content %}
  <div class="container">
    <h2>{% if edit %}Editar Entrada{% else %}Nueva Entrada{% endif %}</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-success" type="submit">
        {% if edit %}Guardar cambios{% else %}Crear entrada{% endif %}
      </button>
      <a class="btn btn-secondary" href="{% url 'correspondencia_app:entrada_list' %}">Cancelar</a>
    </form>
  </div>
{% endblock %}
