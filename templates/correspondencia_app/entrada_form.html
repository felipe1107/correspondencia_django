{% extends 'correspondencia_app/base.html' %}
{% block title %}{% if form.instance.pk %}Editar{% else %}Nueva{% endif %} Entrada{% endblock %}
{% block content %}
  <h2>{% if form.instance.pk %}Editar{% else %}Nueva{% endif %} Entrada</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'entrada_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
{% endblock %}
