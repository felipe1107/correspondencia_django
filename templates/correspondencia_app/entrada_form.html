{% extends 'correspondencia_app/base.html' %}
{% load static %}

{% block content %}
<div class="container inner-bg py-4">
  <h2>Nueva Entrada</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'correspondencia_app:entrada_create' %}" class="btn btn-success">Nuevo</a>
  </form>
</div>
{% endblock %}
