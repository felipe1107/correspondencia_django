{% extends 'correspondencia_app/base.html' %}
{% block title %}Nueva Entrada - Sistema de Correspondencia{% endblock %}

{% block content %}
<div class="card shadow p-4">
  <h4 class="mb-4">Registrar Nueva Entrada</h4>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'correspondencia_app:entrada_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
