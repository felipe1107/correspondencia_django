{% extends 'correspondencia_app/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>¿Está seguro que desea eliminar esta correspondencia de salida?</h2>
    <p><strong>Número de Documento:</strong> {{ salida.numero_documento }}</p>
    <p><strong>Asunto:</strong> {{ salida.asunto }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'lista_salidas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
