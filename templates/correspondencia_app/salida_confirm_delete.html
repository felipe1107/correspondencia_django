{% extends 'correspondencia_app/base.html' %}

{% block content %}
<h2>❌ Confirmar eliminación</h2>

<p>¿Estás seguro de que deseas eliminar la salida: <strong>{{ item.asunto }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">🗑️ Sí, eliminar</button>
    <a href="{% url 'salida_list' %}" class="btn btn-secondary">↩️ Cancelar</a>
</form>
{% endblock %}
