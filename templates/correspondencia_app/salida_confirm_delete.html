{% extends 'correspondencia_app/base.html' %}

{% block content %}
<h2>Confirmar eliminación</h2>
<p>¿Estás seguro de que deseas eliminar la salida <strong>{{ salida.numero_documento }}</strong> - "{{ salida.asunto }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'salida_lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
